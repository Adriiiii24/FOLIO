name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Formato, lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  db:
    name: Aislamiento RLS (pgTAP)
    runs-on: ubuntu-latest
    env:
      # config.toml activa Google con env(); para los tests basta con valores ficticios.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      # Solo lo que necesitan la migración y los tests: Postgres, Auth (esquema auth) y Storage (buckets).
      - run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      # ARCHITECTURE §4.2: database.types.ts se regenera tras cada migración y nunca se edita a mano.
      - name: Los tipos generados coinciden con el esquema
        run: |
          supabase gen types typescript --local > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"
